<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add me on Amidst</title><meta name="description" content="You're invited to share locations privately on Amidst.">
<link rel="stylesheet" href="../style.css"></head>
<body><main>
<img class="icon" src="../icon.png" alt="">
<h1 id="title">Add me on Amidst</h1>
<p>Private, end-to-end encrypted location sharing for family and friends.</p>
<a class="button" id="open" href="amidst://add">Open in Amidst</a>
<a class="button secondary" href="https://github.com/Emphasize5599/family-locator-ios/releases">Get Amidst for iPhone</a>
<a class="button secondary" href="https://github.com/Emphasize5599/george/releases">Get Amidst for Android</a>
<p class="small" id="hint">Already have Amidst? Tap “Open in Amidst” to send a friend request.</p>
</main>
<script>
// The link carries only a public username (?u=name). Usernames are 5–32 lowercase letters or digits;
// anything else is ignored so the page can't be used to inject text.
const u = (new URLSearchParams(location.search).get('u') || '').trim().replace(/^@/, '').toLowerCase();
if (/^[a-z0-9]{5,32}$/.test(u)) {
  document.getElementById('title').textContent = '@' + u + ' invited you to Amidst';
  document.getElementById('open').href = 'amidst://add/' + u;
  document.title = 'Add @' + u + ' on Amidst';
} else {
  document.getElementById('hint').textContent = 'Install Amidst, then add your friend by their username.';
}
</script>
</body></html>
